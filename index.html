<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{
  --paper:#e9eee9; --panel:#f7f9f6; --panel-2:#eef2ee; --ink:#1c2b35; --ink-2:#56666f; --line:#c6d0ca;
  --accent:#0d6b86; --accent-ink:#ffffff; --trace:#e2700c; --warn:#b3261e; --ok:#2f7d46; --grid:#cfd8d1;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141c21; --panel:#1b252b; --panel-2:#222e35; --ink:#e2e9e4; --ink-2:#9aa9a2; --line:#33424a;
  --accent:#4cb6d4; --accent-ink:#08161b; --trace:#ff9a3d; --warn:#ff7b72; --ok:#6cc58a; --grid:#22303a;}}
:root[data-theme="dark"]{
  --paper:#141c21; --panel:#1b252b; --panel-2:#222e35; --ink:#e2e9e4; --ink-2:#9aa9a2; --line:#33424a;
  --accent:#4cb6d4; --accent-ink:#08161b; --trace:#ff9a3d; --warn:#ff7b72; --ok:#6cc58a; --grid:#22303a;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.4 var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ink-2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.del{color:var(--warn)}
button.del.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
button.link{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:56px;resize:vertical}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:600 20px/1 var(--cond);letter-spacing:.01em;margin-right:6px;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
#projSel{max-width:220px}
.searchwrap{position:relative;margin-left:auto}
#search{width:220px}
#results{position:absolute;right:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:260px;max-height:320px;overflow:auto;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#results button{display:block;width:100%;text-align:left;border:none;border-radius:0;background:none;padding:7px 10px}
#results button:hover{background:var(--panel-2)}
#saveState{font-size:13px;color:var(--ink-2);min-width:90px;text-align:right}
.main{display:flex;min-height:0}
#netState{font:600 13px var(--sans);color:#fff;background:var(--warn);border-radius:4px;padding:2px 8px}
#netState[hidden],#installBtn[hidden]{display:none}
.mapwrap{position:relative;flex:1;min-width:0;overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.tools{position:absolute;left:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;z-index:5;max-width:calc(100% - 20px)}
.tools button{display:flex;align-items:center;gap:6px;background:var(--panel);font:500 15px/1 var(--cond);padding:6px 9px}
.tools button svg{width:18px;height:18px;overflow:visible}
.tools button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tools .sep{width:8px}
.hint{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--ink-2);z-index:5;max-width:calc(100% - 20px)}
.hint:empty{display:none}
aside#insp{width:400px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto}
aside section{padding:14px 16px;border-bottom:1px solid var(--line)}
aside h3{font:600 17px/1.2 var(--cond);margin:0 0 8px}
.kind{display:flex;align-items:center;gap:8px;font:600 22px/1.1 var(--cond);margin-bottom:10px}
.kind svg{width:22px;height:22px;overflow:visible}
.fl{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.fl input,.fl select,.fl textarea{color:var(--ink);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-2)}
.msg{font-size:13px;margin:6px 0 0;min-height:1em}
.msg.bad{color:var(--warn)} .msg.good{color:var(--ok)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0 12px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}
.stats dt{color:var(--ink-2)} .stats dd{margin:0;font-weight:600}
.help p{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.cl{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.sform{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center}
.sform .to{grid-column:1/-1;font-size:13px;color:var(--ink-2);margin:-2px 0}
.sform .bot{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sform .bot input{width:64px}
.tablewrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:600 14px/1.2 var(--cond);color:var(--ink-2);padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.tc{white-space:nowrap;text-align:right}
.tag{font-size:12px;color:var(--ink-2);margin-right:4px}
button.x{padding:0 7px;line-height:22px;border-radius:4px}
.ep{white-space:nowrap}
.ep small{color:var(--ink-2)}
.d{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.45);margin-right:2px;vertical-align:-1px}
.foot{display:flex;gap:6px;flex-wrap:wrap}
.foot .del{margin-left:auto}
/* map */
.cab .hit{stroke:transparent;stroke-width:18;cursor:pointer}
.cab .ln{stroke:var(--ink-2);stroke-linecap:round;pointer-events:none}
.cab.ug .ln{stroke-dasharray:9 6}
.cab.sel .ln{stroke:var(--accent)}
.cab.tr .ln{stroke:var(--trace)}
.clab{font:500 11px var(--cond);fill:var(--ink-2);paint-order:stroke;stroke:var(--paper);stroke-width:4px;pointer-events:none}
.cab.tr .clab{fill:var(--trace)}
.nd{cursor:grab}
.nd .sh{fill:var(--panel);stroke:var(--ink);stroke-width:1.8}
.nd.olt .sh{fill:var(--ink)}
.nd.home .sh{fill:var(--panel-2)}
.nd.sel .sh{stroke:var(--accent);stroke-width:3.5}
.nd.tr .sh{stroke:var(--trace);stroke-width:3.5}
.nd.start .sh{stroke:var(--accent);stroke-dasharray:4 3;stroke-width:3}
.nlab{font:600 12px var(--cond);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px;pointer-events:none}
.cab .hit,.cab .ln,.nd .sh{vector-effect:non-scaling-stroke}
.far .nlab,.far .clab{display:none}
.far .nd.sel .nlab,.far .nd.tr .nlab{display:inline}
.imptable select{width:100%}
.modal .box{max-height:90vh}
#impBody{overflow:auto;min-height:0}
#lmap{position:absolute;inset:0;display:none;z-index:1;background:var(--paper);font:inherit}
.mapview #lmap{display:block}.mapview #map{display:none}
.tools,.hint{z-index:1100!important}.trace{z-index:1150!important}.loading{z-index:1200!important}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lnode{background:none;border:none}.lnode svg{width:30px;height:30px;overflow:visible;display:block}
.lnode .lab{position:absolute;top:31px;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 12px var(--cond);color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000;pointer-events:none}
#lmap.far .lnode .lab{display:none}
.leaflet-control-layers,.leaflet-control-scale-line{font:14px var(--sans)}
.ghost{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5;pointer-events:none}
.gridrect{pointer-events:all}
/* trace */
.trace{position:absolute;right:10px;top:54px;bottom:10px;width:min(420px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:6;display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.trace[hidden]{display:none}
.trh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.trh .t{flex:1}
.trh b{font:600 18px/1.2 var(--cond);display:block}
.trh span{font-size:13px;color:var(--ink-2)}
.trb{overflow:auto;padding:10px 12px 14px}
ol.chain{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--trace)}
ol.chain>li{position:relative;padding:3px 0 3px 8px;font-size:14px}
ol.chain>li::before{content:"";position:absolute;left:-20px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--panel);border:2px solid var(--trace)}
ol.chain>li.br{padding-left:0}
ol.chain>li.br::before{display:none}
ol.chain ol.chain{margin:4px 0 6px 2px}
.tn[data-nid]{cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.tn.warn{color:var(--warn);font-weight:600}
.tn.end{font-weight:600;color:var(--ok)}
.tn.muted{color:var(--ink-2)}
.tn.spl{font-weight:600}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);border-radius:10px;padding:16px;width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
.modal textarea{min-height:260px;font-size:12px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-2);z-index:4;pointer-events:none}
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{flex-direction:column}
  .mapwrap{height:62vh;flex:none}
  aside#insp{width:auto;border-left:none;border-top:1px solid var(--line)}
  .searchwrap{margin-left:0;flex:1} #search{width:100%}
  .trace{top:auto;height:55%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const FC=[['BL','#2563c9'],['OR','#ef8a17'],['GR','#2f9e4f'],['BR','#8b5a2b'],['SL','#8d969e'],['WH','#ffffff'],['RD','#d63030'],['BK','#1b1b1b'],['YL','#f1d01a'],['VI','#8a44c4'],['RS','#f3a5bb'],['AQ','#3ccfd3']];
const TYPES={olt:{label:'OLT / hub',prefix:'OLT'},closure:{label:'Splice closure',prefix:'SC'},fdh:{label:'FDH / cabinet',prefix:'FDH'},mst:{label:'Terminal / MST',prefix:'MST'},home:{label:'Home / ONT',prefix:'H'}};
const COUNTS=[1,2,4,6,8,12,24,36,48,72,96,144,216,288];
const STYPES={fusion:'Fusion',mech:'Mech',conn:'Conn'};
const LK='splicemap.v1';

let P=null, projects=[], sel=null, mode='select', cableStart=null, traceState=null;
let geoMsg=null,impData=null;
let view={x:0,y:0,k:1}, db=null, downloads=null, drag=null, pan=null, saveT=null;
const formMemo={};
const svg=$('#map'), world=$('#world');

/* ---------- model helpers ---------- */
function blank(name){return {id:rid(),name,nodes:[],cables:[],splices:[],seq:{},updated:Date.now()}}
const node=id=>P.nodes.find(n=>n.id===id);
const cable=id=>P.cables.find(c=>c.id===id);
function findSpl(id){for(const n of P.nodes)for(const s of (n.splitters||[]))if(s.id===id)return {node:n,spl:s};return {}}
function nextName(prefix){P.seq=P.seq||{};P.seq[prefix]=(P.seq[prefix]||0)+1;return prefix+'-'+String(P.seq[prefix]).padStart(2,'0')}
function fcol(f){const t=Math.floor((f-1)/12),i=(f-1)%12;return {tube:FC[t%12],fib:FC[i],stripe:t>=12}}
function dots(f){const c=fcol(f);return `<i class="d" style="background:${c.tube[1]}" title="Tube ${c.tube[0]}"></i><i class="d" style="background:${c.fib[1]}" title="Fiber ${c.fib[0]}"></i>`}
function nodeLabel(n){return n?(n.type==='home'&&n.addr?n.addr:n.name):'?'}
function epInfo(ep){
  const [t,id,x]=ep.split(':');
  if(t==='c'){const c=cable(id),f=+x,col=fcol(f),cc=`${col.tube[0]}${col.stripe?'*':''}/${col.fib[0]}`;
    return {txt:`${c?c.name:'?'} F${f} ${cc}`,html:`<span class="ep">${dots(f)} <b>${esc(c?c.name:'?')}</b> F${f} <small>${cc}</small></span>`}}
  if(t==='s'){const {spl}=findSpl(id),nm=spl?spl.name:'?',lab=x==='in'?`Splitter ${nm} in`:`Splitter ${nm} out ${x.slice(1)}`;
    return {txt:lab,html:`<span class="ep">${esc(lab)}</span>`}}
  if(t==='p'){const n=node(id),lab=`${n?n.name:'?'} PON ${x}`;return {txt:lab,html:`<span class="ep"><b>${esc(lab)}</b></span>`}}
  return {txt:ep,html:esc(ep)};
}
function partners(nid,ep){return P.splices.filter(s=>s.node===nid&&(s.a===ep||s.b===ep)).map(s=>s.a===ep?s.b:s.a)}
function epSort(a,b){return a.localeCompare(b,undefined,{numeric:true})}
function groupsAt(nid){
  const n=node(nid),g=[];
  if(n.type==='olt')g.push({key:'p:'+nid,label:`PON ports (${n.ports||16})`,size:n.ports||16,ep:i=>`p:${nid}:${i}`});
  for(const c of P.cables)if(c.from===nid||c.to===nid){const o=node(c.from===nid?c.to:c.from);
    g.push({key:'c:'+c.id,label:`${c.name} ${c.count}F, ${c.from===nid?'to':'from'} ${nodeLabel(o)}`,size:c.count,ep:i=>`c:${c.id}:${i}`})}
  for(const s of n.splitters||[]){
    g.push({key:'si:'+s.id,label:`Splitter ${s.name} input`,size:1,ep:()=>`s:${s.id}:in`});
    g.push({key:'so:'+s.id,label:`Splitter ${s.name} outputs (1x${s.ratio})`,size:s.ratio,ep:i=>`s:${s.id}:o${i}`});
  }
  return g;
}

/* ---------- trace ---------- */
function tracer(){
  const vis=new Set(),nodes=new Set(),cables=new Set();
  function arrive(nid,ep){
    nodes.add(nid);const n=node(nid),k=nid+'|'+ep;
    if(vis.has(k))return {t:`Loops back to ${esc(n.name)}`,cls:'warn'};
    vis.add(k);
    if(n.type==='home')return {t:`ONT at ${esc(nodeLabel(n))}`,cls:'end home',nid};
    const ps=partners(nid,ep);
    if(!ps.length)return {t:`Dead end: not spliced at ${esc(n.name)}`,cls:'warn',nid};
    return {t:esc(n.name),nid,kids:ps.map(p=>enter(nid,p))};
  }
  function enter(nid,ep){
    const k=nid+'|'+ep;if(vis.has(k))return {t:'Already traced',cls:'muted'};vis.add(k);
    const [t,id,x]=ep.split(':');
    if(t==='c'){const c=cable(id);if(!c)return {t:'Missing cable',cls:'warn'};cables.add(id);
      return {t:epInfo(ep).html,kids:[arrive(c.from===nid?c.to:c.from,ep)]}}
    if(t==='p'){nodes.add(id);return {t:`${esc(node(id).name)} PON ${x}`,cls:'end olt',nid:id}}
    if(t==='s'){const {spl}=findSpl(id);if(!spl)return {t:'Missing splitter',cls:'warn'};
      if(x==='in'){const kids=[],unused=[];
        for(let i=1;i<=spl.ratio;i++){const oe=`s:${id}:o${i}`;vis.add(nid+'|'+oe);const ps=partners(nid,oe);
          if(ps.length)kids.push({t:`Out ${i}`,cls:'spl',kids:ps.map(p=>enter(nid,p))});else unused.push(i)}
        if(unused.length)kids.push({t:`Unused outputs: ${unused.join(', ')}`,cls:'muted'});
        return {t:`Splitter ${esc(spl.name)} 1x${spl.ratio} in`,cls:'spl',kids}}
      const ie=`s:${id}:in`;vis.add(nid+'|'+ie);const ps=partners(nid,ie);
      return {t:`Splitter ${esc(spl.name)} out ${x.slice(1)}, to input`,cls:'spl',kids:ps.length?ps.map(p=>enter(nid,p)):[{t:'Splitter input not spliced',cls:'warn'}]}}
    return {t:esc(ep)};
  }
  return {arrive,enter,vis,nodes,cables};
}
function summarize(tree){let homes=0;const olts=[];(function w(t){if(!t)return;if(t.cls==='end home')homes++;if(t.cls==='end olt')olts.push(t.t);(t.kids||[]).forEach(w)})(tree);

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const n of P.nodes){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)}
  const k=Math.max(.02,Math.min(1.6,(r.width-120)/Math.max(1,x1-x0),(r.height-140)/Math.max(1,y1-y0)));

function showImport(){const {file,pg,lg}=impData;

  const prow=([g,items],i)=>{let t=guessType(g);if(!t){const v=items.slice(0,20).map(x=>guessType(x.name)).filter(Boolean);t=v[0]||(items.filter(x=>/^\d+\s+\S/.test(x.name)).length>items.length/2?'home':'closure')}
    return `<tr><td>${esc(g)}</td><td>${items.length}</td><td><select data-pg="${i}">${topt(t)}</select></td></tr>`};
  const lrow=([g,items],i)=>{const skip=/(strand|messenger|\bguy|road|parcel|boundary|easement|row\b)/i.test(g);const dc=/drop/i.test(g)?1:(countFrom(g)||12);
    return `<tr><td>${esc(g)}</td><td>${items.length}</td><td><select data-lg="${i}"><option value="cable">Cables</option><option value="skip" ${skip?'selected':''}>Skip</option></select></td><td><select data-lc="${i}">${COUNTS.map(c=>`<option value="${c}" ${c===dc?'selected':''}>${c}F</option>`).join('')}</select></td></tr>`};
  $('#impBody').innerHTML=`<p class="muted" style="margin:0 0 8px">${esc(file)}: ${pg.reduce((s,g)=>s+g[1].length,0)} points and ${lg.reduce((s,g)=>s+g[1].length,0)} lines. Choose what each folder becomes. Everything lands in the current project, ${esc(P.name)}.</p>
  ${pg.length?`<table class="imptable"><thead><tr><th>Point folder</th><th>Count</th><th>Import as</th></tr></thead><tbody>${pg.map(prow).join('')}</tbody></table>`:''}
  ${lg.length?`<table class="imptable" style="margin-top:12px"><thead><tr><th>Line folder</th><th>Count</th><th>Import as</th><th>Default count</th></tr></thead><tbody>${lg.map(lrow).join('')}</tbody></table>
  <p class="muted" style="font-size:13px">A line becomes a cable when both ends land near an imported node. Fiber count is read from the line name (like "48F" or "144ct") when present. Drops to homes are set to 1F.</p>
  <label class="fl" style="max-width:220px">Snap line ends within (ft)<input id="snapFt" type="number" min="1" value="50"></label>`:''}`;
  $('#imp').hidden=false}
$('#impCancel').addEventListener('click',()=>{$('#imp').hidden=true;impData=null});
$('#impGo').addEventListener('click',()=>{const {pg,lg}=impData;
  const pmap=pg.map((_,i)=>$(`[data-pg="${i}"]`).value),lmap=lg.map((_,i)=>$(`[data-lg="${i}"]`).value),lcnt=lg.map((_,i)=>+$(`[data-lc="${i}"]`).value);
  const tol=(+($('#snapFt')?.value)||50)/M2FT;
  const pts=pg.flatMap(([g,it],i)=>pmap[i]==='skip'?[]:it.map(x=>({...x,type:pmap[i]})));
  const lns=lg.flatMap(([g,it],i)=>lmap[i]==='skip'?[]:it.map(x=>({...x,def:lcnt[i]})));
  if(!pts.length&&!lns.length){$('#imp').hidden=true;return}
  if(!P.geo){const all=pts.length?pts.map(p=>[p.lon,p.lat]):lns.flatMap(l=>l.path);ensureGeo(all.reduce((s,a)=>s+a[1],0)/all.length,all.reduce((s,a)=>s+a[0],0)/all.length)}
  let nAdd=0,dup=0;
  for(const p of pts){
    if(P.nodes.some(n=>{const ll=nodeLL(n);return ll&&ll.real&&(n.name===p.name||n.addr===p.name)&&hav([ll.lon,ll.lat],[p.lon,p.lat])<3})){dup++;continue}
    const n={id:rid(),type:p.type,notes:'',lat:p.lat.toFixed(7),lon:p.lon.toFixed(7),...proj(p.lat,p.lon)};
    if(p.type==='home'){n.name=nextName('H');n.addr=p.name}else n.name=p.name||nextName(TYPES[p.type].prefix);
    if(p.type==='olt')n.ports=16;if(p.type!=='home')n.splitters=[];P.nodes.push(n);nAdd++}
  const cand=P.nodes.map(n=>({n,ll:nodeLL(n)})).filter(x=>x.ll&&x.ll.real);
  const near=c=>{let best=null,bd=tol;for(const x of cand){const d=hav(c,[x.ll.lon,x.ll.lat]);if(d<=bd){bd=d;best=x.n}}return best};
  let cAdd=0,cSkip=0;
  for(const l of lns){let a=near(l.path[0]),b=near(l.path[l.path.length-1]),path=l.path;
    if(!a||!b||a===b){cSkip++;continue}
    if(RANK[a.type]>RANK[b.type]){[a,b]=[b,a];path=[...path].reverse()}
    const drop=a.type==='home'||b.type==='home';let m=0;for(let i=1;i<path.length;i++)m+=hav(path[i-1],path[i]);
    const pre=drop?'D':(a.type==='olt'||b.type==='olt')?'F':'C';
    P.cables.push({id:rid(),name:l.name||nextName(pre),from:a.id,to:b.id,count:drop?1:(countFrom(l.name)||l.def),ft:String(Math.round(m*M2FT)),
      kind:/(\bug\b|underground|bore|conduit|duct)/i.test(l.group+' '+l.name)?'ug':'aerial',notes:'',path:path.map(c=>[+c[0].toFixed(7),+c[1].toFixed(7)])});cAdd++}
  $('#imp').hidden=true;impData=null;
  geoMsg={t:`Added ${nAdd} node${nAdd===1?'':'s'} and ${cAdd} cable${cAdd===1?'':'s'}.`+(dup?` ${dup} points were already in the project.`:'')+(cSkip?` ${cSkip} lines skipped because an end wasn't near a node; raise the snap distance or add the missing node.`:''),bad:!nAdd&&!cAdd};
  save();sel=null;renderAll();requestAnimationFrame(fit)});
function layoutGps(){const withLL=P.nodes.filter(n=>{const ll=nodeLL(n);return ll&&ll.real});
  if(!withLL.length){geoMsg={t:'No nodes have latitude and longitude yet.',bad:true};renderInsp();return}
  if(!P.geo){const L=withLL.map(n=>nodeLL(n));ensureGeo(L.reduce((s,x)=>s+x.lat,0)/L.length,L.reduce((s,x)=>s+x.lon,0)/L.length)}
  for(const n of withLL){const ll=nodeLL(n);Object.assign(n,proj(ll.lat,ll.lon))}
  geoMsg={t:`Placed ${withLL.length} nodes by GPS.`+(withLL.length<P.nodes.length?` ${P.nodes.length-withLL.length} without coordinates stayed where they were.`:'')};
  save();renderAll();requestAnimationFrame(fit)}
const strip=s=>String(s).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\s+/g,' ').trim();
function flatText(t){const out=[];let c=t;while(c){out.push(strip(c.t));c=c.kids&&c.kids.length===1?c.kids[0]:null}return out.join(' → ')}
function kmlColor(hex,a='ff'){const h=hex.replace('#','');return a+h.slice(4,6)+h.slice(2,4)+h.slice(0,2)}
function buildKml(){
  const ICON={olt:'ranger_station',closure:'placemark_circle',fdh:'square',mst:'triangle',home:'homegardenbusiness'};
  const ICOL={olt:'#1c2b35',closure:'#0d6b86',fdh:'#7b3fb8',mst:'#2f7d46',home:'#e2700c'};
  let styles=Object.keys(ICON).map(t=>`<Style id="n-${t}"><IconStyle><color>${kmlColor(ICOL[t])}</color><scale>1</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/${ICON[t]}.png</href></Icon></IconStyle><LabelStyle><scale>0.8</scale></LabelStyle></Style>`).join('');
  styles+=`<Style id="c-drop"><LineStyle><color>${kmlColor('#f1d01a')}</color><width>1.5</width></LineStyle></Style><Style id="c-dist"><LineStyle><color>${kmlColor('#ef8a17')}</color><width>3</width></LineStyle></Style><Style id="c-feed"><LineStyle><color>${kmlColor('#d63030')}</color><width>5</width></LineStyle></Style>`;
  let missing=0;const cd=s=>`<![CDATA[${String(s).replace(/]]>/g,']]&gt;')}]]>`;
  const folders=Object.keys(TYPES).map(t=>{const pms=P.nodes.filter(n=>n.type===t).map(n=>{const ll=nodeLL(n);if(!ll){missing++;return ''}
    let d=`<b>${esc(TYPES[t].label)}</b>`+(n.addr?`<br>${esc(n.addr)}`:'')+(n.notes?`<br>${esc(n.notes)}`:'');
    if(t==='home'){const {tree}=homeTree(n.id);d+=(n.cust?`<br>Customer: ${esc(n.cust)}`:'')+(n.ont?`<br>ONT: ${esc(n.ont)}`:'')+`<br><br><b>Path</b><br>${esc(flatText(tree))}`}
    else{const sp=P.splices.filter(s=>s.node===n.id).sort((a,b)=>epSort(a.a,b.a));
      if((n.splitters||[]).length)d+=`<br><br><b>Splitters</b><br>${n.splitters.map(s=>esc(s.name)+' 1x'+s.ratio).join(', ')}`;
      if(sp.length)d+=`<br><br><b>Splices (${sp.length})</b><table border="1" cellpadding="2" style="border-collapse:collapse">${sp.map(s=>`<tr><td>${esc(epInfo(s.a).txt)}</td><td>${esc(epInfo(s.b).txt)}</td></tr>`).join('')}</table>`}
    return `<Placemark><name>${esc(nodeLabel(n))}</name><styleUrl>#n-${t}</styleUrl><description>${cd(d)}</description><Point><coordinates>${(+ll.lon).toFixed(7)},${(+ll.lat).toFixed(7)},0</coordinates></Point></Placemark>`}).join('');
    return `<Folder><name>${esc(TYPES[t].label)}</name>${pms}</Folder>`}).join('');
  const cab=P.cables.map(c=>{const A=node(c.from),B=node(c.to);let path=c.path;
    if(!path){const a=nodeLL(A),b=nodeLL(B);if(!a||!b)return '';path=[[a.lon,a.lat],[b.lon,b.lat]]}
    const st=c.count<=2?'c-drop':(A.type==='olt'||B.type==='olt'||c.count>=96)?'c-feed':'c-dist';
    const d=`${c.count}F ${c.kind==='ug'?'underground':'aerial'}${c.ft?', '+esc(c.ft)+' ft':''}<br>${esc(nodeLabel(A))} to ${esc(nodeLabel(B))}`+(c.notes?`<br>${esc(c.notes)}`:'');
    return `<Placemark><name>${esc(c.name)} ${c.count}F</name><styleUrl>#${st}</styleUrl><description>${cd(d)}</description><LineString><tessellate>1</tessellate><coordinates>${path.map(p=>`${(+p[0]).toFixed(7)},${(+p[1]).toFixed(7)},0`).join(' ')}</coordinates></LineString></Placemark>`}).join('');
  const kml=`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${esc(P.name)}</name>${styles}${folders}<Folder><name>Cables</name>${cab}</Folder></Document></kml>`;
  return {kml,missing}}
async function exportKml(){const {kml,missing}=buildKml();
  if(!P.geo&&missing===P.nodes.length){geoMsg={t:'Nothing to export yet: add latitude and longitude to your nodes, or import a KML first.',bad:true};renderInsp();return}
  const note=missing?` ${missing} node${missing>1?'s':''} without coordinates were left out.`:'';
  if(downloads&&window.JSZip){try{const z=new JSZip();z.file('doc.kml',kml);
      await downloads.save({filename:slug(P.name)+'.kmz.zip',data:await z.generateAsync({type:'blob',compression:'DEFLATE'})});
      geoMsg={t:'Saved. Rename the file to end in .kmz (drop the .zip), then open it in Google Earth.'+note};renderInsp();return}
    catch(e){if(e&&e.code==='declined')return}}
  if(!window.claude){if(window.JSZip){const z=new JSZip();z.file('doc.kml',kml);downloadBlob(slug(P.name)+'.kmz',await z.generateAsync({type:'blob',compression:'DEFLATE'}))}
    else downloadBlob(slug(P.name)+'.kml',new Blob([kml],{type:'application/vnd.google-earth.kml+xml'}));
    geoMsg={t:'Exported. Open the file in Google Earth.'+note};renderInsp();return}
  $('#mTitle').textContent=slug(P.name)+'.kml';$('#mSub').textContent='Copy this into a text file named '+slug(P.name)+'.kml and open it in Google Earth.'+note;$('#mText').value=kml;$('#modal').hidden=false}

/* ---------- satellite map (Leaflet) ---------- */
let viewMode=(()=>{try{return localStorage.getItem('splicemap.view')||'schem'}catch{return 'schem'}})();
let lmap=null,lLayer=null,ghostL=null,routePts=[],lFitted=false,lMissing=0;
function pathFt(path){let m=0;for(let i=1;i<path.length;i++)m+=hav(path[i-1],path[i]);return String(Math.round(m*M2FT))}
function llOf(n){const ll=nodeLL(n);return ll?[ll.lat,ll.lon]:null}
function initLeaflet(){if(lmap||!window.L)return;
  const ArcExport=L.TileLayer.extend({getTileUrl(c){const ts=this.getTileSize(),m=this._map,z=c.z,
    nw=m.unproject(L.point(c.x*ts.x,c.y*ts.y),z),se=m.unproject(L.point((c.x+1)*ts.x,(c.y+1)*ts.y),z),
    a=L.CRS.EPSG3857.project(nw),b=L.CRS.EPSG3857.project(se);
    return `${this._url}/export?bbox=${a.x},${b.y},${b.x},${a.y}&bboxSR=3857&imageSR=3857&size=${ts.x},${ts.y}&format=jpg&f=image`}});
  lmap=L.map('lmap',{zoomControl:false,maxZoom:21}).setView([42.66,-77.05],12);
  const base={
    'NY State orthos (6–12 in)':new ArcExport('https://orthos.its.ny.gov/arcgis/rest/services/wms/Latest/MapServer',{maxZoom:21,attribution:'NYS ITS Geospatial Services'}),
    'Esri satellite':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:21,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}),
    'USGS imagery':L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:16,maxZoom:21,attribution:'USGS The National Map'}),
    'Street map (OSM)':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxNativeZoom:19,maxZoom:21,attribution:'© OpenStreetMap contributors'})};
  const roads=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:21,attribution:'Roads © Esri'});
  let saved='';try{saved=localStorage.getItem('splicemap.base')||''}catch{}
  (base[saved]||base['NY State orthos (6–12 in)']).addTo(lmap);roads.addTo(lmap);
  L.control.layers(base,{'Road names':roads},{position:'bottomright'}).addTo(lmap);
  L.control.scale({imperial:true,metric:false,position:'bottomright'}).addTo(lmap);
  lmap.on('baselayerchange',e=>{try{localStorage.setItem('splicemap.base',e.name)}catch{}});
  lLayer=L.layerGroup().addTo(lmap);
  lmap.on('click',e=>{const {lat,lng}=e.latlng;
    if(mode.startsWith('add:')){addNodeLL(mode.slice(4),lat,lng);return}
    if(mode==='cable'&&cableStart){routePts.push([+lng.toFixed(7),+lat.toFixed(7)]);drawGhost();return}
    if(mode==='select'&&sel)select(null)});
  lmap.on('mousemove',e=>{if(mode==='cable'&&cableStart)drawGhost(e.latlng)});
  lmap.on('zoomend',()=>$('#lmap').classList.toggle('far',lmap.getZoom()<16));}
function renderLeaflet(){if(!lmap)return;lLayer.clearLayers();if(ghostL){ghostL.remove();ghostL=null}
  const hn=traceState&&traceState.nodes,hc=traceState&&traceState.cables;let missing=0;
  for(const c of P.cables){const A=node(c.from),B=node(c.to);if(!A||!B)continue;
    let pts=c.path?c.path.map(p=>[p[1],p[0]]):null;if(!pts){const a=llOf(A),b=llOf(B);if(!a||!b)continue;pts=[a,b]}
    const on=sel&&sel.kind==='cable'&&sel.id===c.id,tr=hc&&hc.has(c.id),w=c.count<=2?2:c.count<=12?3:c.count<=48?4:6;
    L.polyline(pts,{color:tr?'#ff9a3d':on?'#4cd2f4':(c.count<=2?'#f1d01a':'#ef8a17'),weight:tr||on?w+3:w,opacity:.95,dashArray:c.kind==='ug'?'10 7':null,interactive:false}).addTo(lLayer);
    L.polyline(pts,{color:'#000',opacity:0,weight:18,bubblingMouseEvents:false})
      .bindTooltip(`${esc(c.name)} ${c.count}F${c.ft?', '+esc(c.ft)+' ft':''}`,{sticky:true})
      .on('click',()=>{if(mode!=='cable')select('cable',c.id)}).addTo(lLayer)}
  for(const n of P.nodes){const ll=llOf(n);if(!ll){missing++;continue}
    const cls=`nd ${n.type}`+(sel&&sel.kind==='node'&&sel.id===n.id?' sel':'')+(hn&&hn.has(n.id)?' tr':'')+(cableStart===n.id?' start':'');
    const icon=L.divIcon({className:'lnode',html:`<svg viewBox="-18 -18 36 36" class="${cls}">${shape(n.type)}</svg><div class="lab">${esc(nodeLabel(n))}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
    const m=L.marker(ll,{icon,draggable:mode==='select',keyboard:false,riseOnHover:true}).addTo(lLayer);
    m.on('click',()=>onNodeClickL(n.id));m.on('dragend',e=>{const p=e.target.getLatLng();moveNodeLL(n,p.lat,p.lng)})}
  lMissing=missing;if(cableStart)drawGhost();$('#hint').textContent=hintText()}
function onNodeClickL(id){
  if(mode==='cable'){if(!cableStart){cableStart=id;routePts=[]}
    else if(id!==cableStart){const la=nodeLL(node(cableStart)),lb=nodeLL(node(id));const from=cableStart;cableStart=null;
      addCable(from,id,[[+la.lon.toFixed(7),+la.lat.toFixed(7)],...routePts,[+lb.lon.toFixed(7),+lb.lat.toFixed(7)]]);routePts=[]}
    renderTools();renderMap();return}
  select('node',id)}
function drawGhost(cur){if(!lmap)return;const a=cableStart&&nodeLL(node(cableStart));if(!a){if(ghostL){ghostL.remove();ghostL=null}return}
  const pts=[[a.lat,a.lon],...routePts.map(p=>[p[1],p[0]])];if(cur)pts.push([cur.lat,cur.lng]);
  if(!ghostL)ghostL=L.polyline(pts,{color:'#4cd2f4',weight:2.5,dashArray:'6 5',interactive:false}).addTo(lmap);else ghostL.setLatLngs(pts);
  $('#hint').textContent=`From ${nodeLabel(node(cableStart))}: ${pathFt(pts.map(p=>[p[1],p[0]]))} ft so far. Click to add bends, click the end node to finish. Backspace undoes a bend.`}
function addNodeLL(type,lat,lon){ensureGeo(lat,lon);addNode(type,proj(lat,lon),{lat:lat.toFixed(7),lon:lon.toFixed(7)})}
function moveNodeLL(n,lat,lon){ensureGeo(lat,lon);n.lat=lat.toFixed(7);n.lon=lon.toFixed(7);Object.assign(n,proj(lat,lon));
  for(const c of P.cables){if(!c.path||(c.from!==n.id&&c.to!==n.id))continue;const pt=[+lon.toFixed(7),+lat.toFixed(7)];
    if(c.from===n.id)c.path[0]=pt;if(c.to===n.id)c.path[c.path.length-1]=pt;c.ft=pathFt(c.path)}
  save();renderMap();if(sel&&sel.kind==='node'&&sel.id===n.id)renderInsp()}
function fitLeaflet(){if(!lmap)return;const pts=[];P.nodes.forEach(n=>{const l=llOf(n);if(l)pts.push(l)});P.cables.forEach(c=>(c.path||[]).forEach(p=>pts.push([p[1],p[0]])));
  if(pts.length)lmap.fitBounds(pts,{padding:[50,50],maxZoom:18})}
function setView(v){if(v==='map'&&!window.L){geoMsg={t:'The map library did not load. Check your connection and reload.',bad:true};renderInsp();return}
  viewMode=v;try{localStorage.setItem('splicemap.view',v)}catch{}
  document.body.classList.toggle('mapview',v==='map');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  cableStart=null;routePts=[];renderTools();
  if(v==='map'){initLeaflet();setTimeout(()=>{lmap.invalidateSize();renderMap();if(!lFitted){fitLeaflet();lFitted=true}},0)}
  else{renderMap();requestAnimationFrame(fit)}}
$('#viewSeg').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});
function hintText(){const m=viewMode==='map';
  if(mode.startsWith('add:'))return `Click the ${m?'imagery':'map'} to place a ${TYPES[mode.slice(4)].label.toLowerCase()}. Esc to stop.`;
  if(mode==='cable')return cableStart?`From ${nodeLabel(node(cableStart))}: ${m?'click along the route to add bends, then click':'now click'} the other end.`:'Click the upstream node first. Esc to finish.';
  if(m)return 'Drag markers to move them. Click a node or cable to edit it.'+(lMissing?` ${lMissing} node${lMissing>1?'s have':' has'} no GPS and only show on the schematic.`:'');
  return 'Drag nodes to move them. Drag empty space to pan, scroll to zoom.'}
function downloadBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

/* ---------- init ---------- */
(async function init(){
  renderTools();setSave('');
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [db,downloads]=await Promise.all([use('db'),use('downloads')]);
  projects=await listProjects();
  if(!projects.length){const p=blank('First build');projects.push(p);P=p;await saveNow()}
  projects.sort((a,b)=>(b.updated||0)-(a.updated||0));
  $('#loading').remove();openProject(projects[0].id);setView(viewMode);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
  if(!db)setSave('Saving in this browser only');
})();
window.addEventListener('resize',()=>applyView());

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW failed',e)));
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('#installBtn').hidden=false});
$('#installBtn').addEventListener('click',async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;$('#installBtn').hidden=true});
window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true});
const netUpd=()=>{$('#netState').hidden=navigator.onLine};window.addEventListener('online',netUpd);window.addEventListener('offline',netUpd);netUpd();
</script>
